worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Upstream backend — override BACKEND_URL via envsubst at container start
  upstream backend {
    server ${BACKEND_URL};
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api to backend
    location /api/ {
      proxy_pass http://backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;

      include /etc/nginx/nginx-security-headers.conf;

      # Do not cache API responses
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Astro docs — static HTML at /docs/*
    location ^~ /docs {
      # Serve the Astro-built 404 page with a real 404 status. A plain try_files
      # fallback file returns 200 (a soft-404), which misleads crawlers and
      # uptime monitors; error_page preserves the not-found status code.
      error_page 404 /docs/404/index.html;
      try_files $uri $uri/ $uri/index.html =404;
      include /etc/nginx/nginx-security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Astro docs hashed assets
    location ^~ /_astro/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Docs Geist fonts (served from /fonts/*)
    location ^~ /fonts/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Static assets — long-lived cache (hashed filenames)
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # index.html — always revalidate so new deployments are picked up immediately
    location = /index.html {
      include /etc/nginx/nginx-security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }

    # SPA fallback — all unmatched paths serve index.html for client-side routing
    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/nginx-security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}