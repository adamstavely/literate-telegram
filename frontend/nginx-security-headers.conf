    # Security headers — repeated here because nginx child locations replace
    # parent add_header directives (index.html and SPA fallback must carry CSP).
    # style-src 'unsafe-inline' is required for Angular component <style> injection;
    # script-src stays strict (no unsafe-inline/eval). HSTS is set at the ingress layer.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';" always;
