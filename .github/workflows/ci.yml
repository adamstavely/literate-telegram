name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  styles-sync:
    name: Vendored CSS in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-styles-sync.mjs
      - run: node scripts/check-nginx-security-headers.mjs

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      # Guard the Dependabot overrides: all nine live in frontend/package.json,
      # so a removed/stale override must fail here, not silently regress.
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Unit tests (headless Chrome)
        run: npm run test:ci
        env:
          CHROME_BIN: chrome

  docs:
    name: Docs (Astro build + check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile ./backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile .

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ./helm --set elasticsearch.password=ci-test-password
      - run: helm template interop ./helm --set elasticsearch.password=ci-test-password > /dev/null
      - name: NetworkPolicy structure check
        run: node scripts/check-helm-networkpolicy.mjs

  compose:
    name: Compose config validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Compose smoke (healthchecks)
        run: |
          docker compose up -d --wait --timeout 180
          curl -fsS http://localhost:4200/ > /dev/null
          curl -fsS http://localhost:4200/docs/overview > /dev/null
          curl -fsS http://localhost:4200/api/health/ready > /dev/null
          docker compose down
