apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interop.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interop.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "interop.frontend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
        {{- range .Values.networkPolicy.extraIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              {{- include "interop.seedJob.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    {{- if .Values.networkPolicy.allowProbeIngress }}
    # Kubelet health/readiness probes originate from the node, not frontend/ingress pods.
    - ports:
        - protocol: TCP
          port: 3000
    {{- end }}
  egress:
    - ports:
        - protocol: TCP
          port: 9200
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interop.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interop.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.frontendRestrictIngress }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
        {{- range .Values.networkPolicy.extraIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- else }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.networkPolicy.allowProbeIngress }}
    - ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "interop.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 53
{{- if .Values.elasticsearch.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "interop.fullname" . }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "interop.elasticsearch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "interop.backend.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9200
    - from:
        - podSelector:
            matchLabels:
              {{- include "interop.seedJob.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9200
  egress:
    # Elasticsearch does not require outbound cluster access; allow DNS only.
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 53
{{- end }}
