{{- if not .Values.backend.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.envSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
  annotations:
    # Helm will not delete this secret on uninstall to avoid losing credentials.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  ES_PASSWORD:   {{ required "elasticsearch.password is required when managing secrets via Helm" .Values.elasticsearch.password | b64enc | quote }}
  OIDC_ISSUER:   {{ .Values.oidc.issuer   | default "" | b64enc | quote }}
  OIDC_AUDIENCE: {{ .Values.oidc.audience | default "" | b64enc | quote }}
  OIDC_JWKS_URI: {{ .Values.oidc.jwksUri  | default "" | b64enc | quote }}
{{- end }}
