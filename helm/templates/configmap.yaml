apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interop.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | default "production" | quote }}
  PORT: {{ .Values.backend.env.PORT | default "3000" | quote }}
  LOG_LEVEL: {{ .Values.backend.env.LOG_LEVEL | default "info" | quote }}
  ES_NODE: {{ include "interop.elasticsearch.url" . | quote }}
  ES_USERNAME: {{ .Values.elasticsearch.username | default "elastic" | quote }}
  ALLOWED_ORIGINS: {{ .Values.backend.env.ALLOWED_ORIGINS | default "https://interop.io" | quote }}
  RATE_LIMIT_WINDOW_MS: {{ .Values.backend.env.RATE_LIMIT_WINDOW_MS | default "60000" | quote }}
  RATE_LIMIT_MAX: {{ .Values.backend.env.RATE_LIMIT_MAX | default "200" | quote }}
  LOG_INDEX: {{ .Values.backend.env.LOG_INDEX | default "interop-logs" | quote }}
  AUDIT_INDEX: {{ .Values.backend.env.AUDIT_INDEX | default "interop-audit" | quote }}
  TRUST_PROXY: {{ .Values.backend.env.TRUST_PROXY | default "1" | quote }}
