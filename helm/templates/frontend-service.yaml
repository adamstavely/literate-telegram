apiVersion: v1
kind: Service
metadata:
  name: {{ include "interop.frontend.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interop.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "interop.frontend.selectorLabels" . | nindent 4 }}
