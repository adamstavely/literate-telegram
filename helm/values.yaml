global:
  imageRegistry: ""
  imagePullSecrets: []

# ---------------------------------------------------------------------------
# Image configuration
# ---------------------------------------------------------------------------
image:
  frontend:
    repository: interop/frontend
    tag: ""   # Defaults to Chart.appVersion when empty
    digest: ""  # Optional sha256 digest (e.g. sha256:abc...) — takes precedence over tag
    pullPolicy: IfNotPresent
  backend:
    repository: interop/backend
    tag: ""   # Defaults to Chart.appVersion when empty
    digest: ""  # Optional sha256 digest (e.g. sha256:abc...) — takes precedence over tag
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Service configuration
# ---------------------------------------------------------------------------
service:
  frontend:
    type: ClusterIP
    port: 80
  backend:
    type: ClusterIP
    port: 3000

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
  hosts:
    - host: interop.io
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: interop-tls
      hosts:
        - interop.io

# ---------------------------------------------------------------------------
# Backend workload
# ---------------------------------------------------------------------------
backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    PORT: "3000"
    LOG_LEVEL: info
    ALLOWED_ORIGINS: "https://interop.io"
    RATE_LIMIT_WINDOW_MS: "60000"
    RATE_LIMIT_MAX: "200"
    LOG_INDEX: "interop-logs"
    AUDIT_INDEX: "interop-audit"
    TRUST_PROXY: "1"
    INGEST_RATE_LIMIT_WINDOW_MS: "60000"
    INGEST_RATE_LIMIT_MAX: "30"
  # Name of the Secret that holds ES_PASSWORD, OIDC_ISSUER, OIDC_AUDIENCE, OIDC_JWKS_URI.
  # When existingSecret is set, Helm will not render secret.yaml — provision the Secret out-of-band.
  envSecret: interop-backend-secrets
  existingSecret: ""

# ---------------------------------------------------------------------------
# Frontend workload
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # The value injected as BACKEND_URL into nginx — points at the backend service
  backendUrl: "interop-backend:3000"

# ---------------------------------------------------------------------------
# Elasticsearch (built-in single-node StatefulSet)
# Set enabled=false and provide host/port to use an external cluster.
# ---------------------------------------------------------------------------
elasticsearch:
  enabled: true
  # Full URL override (e.g. https://es.example.com:9200) — takes precedence over scheme/host/port.
  url: ""
  scheme: "http"
  host: ""        # External host — used only when enabled=false
  port: 9200
  # SHA-256 cert fingerprint for HTTPS ES (maps to ES_CA_FINGERPRINT in the backend).
  caFingerprint: ""
  username: elastic
  password: ""   # Required when elasticsearch.enabled=true — never commit real values
  storageSize: 10Gi
  storageClassName: ""   # Leave blank to use cluster default StorageClass
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  javaOpts: "-Xms512m -Xmx512m"
  # Set sysctlInit=true only when nodes lack vm.max_map_count=262144 (requires privileged init).
  sysctlInit: false

# ---------------------------------------------------------------------------
# OIDC / JWT settings (values stored in the Secret, not here)
# Provide these at install time with --set or a sealed-secrets override.
# ---------------------------------------------------------------------------
oidc:
  issuer: ""
  audience: ""
  jwksUri: ""

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# ---------------------------------------------------------------------------
# ServiceAccount
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# Pod metadata
# ---------------------------------------------------------------------------
# Pod metadata — Prometheus scrape disabled until /api/metrics is implemented.
podAnnotations: {}

# ---------------------------------------------------------------------------
# Security contexts
# ---------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# Pod scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Network policies
# ---------------------------------------------------------------------------
networkPolicy:
  # Restrict frontend ingress to the ingress controller namespace (common default).
  frontendRestrictIngress: true
  # Namespace where the ingress controller runs (e.g. ingress-nginx, traefik).
  ingressControllerNamespace: ingress-nginx
  # Additional ingress-controller namespaces for multi-controller clusters.
  extraIngressNamespaces: []
  # Allow kubelet probes from the node (required on some CNIs).
  allowProbeIngress: true
